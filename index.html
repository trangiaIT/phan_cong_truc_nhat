<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch Trực — Thứ 2 đến Thứ 7</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>📅 Lịch Trực Hàng Tuần</h1>
      <p class="subtitle" id="weekInfo"></p>
    </header>

    <!-- Lịch hiển thị chính -->
    <section class="schedule-grid">
      <div class="day-card" id="day-0">
        <div class="day-label"></div>
        <div class="day-date"></div>
        <div class="day-person"></div>
      </div>
      <div class="day-card" id="day-1">
        <div class="day-label"></div>
        <div class="day-date"></div>
        <div class="day-person"></div>
      </div>
      <div class="day-card" id="day-2">
        <div class="day-label"></div>
        <div class="day-date"></div>
        <div class="day-person"></div>
      </div>
      <div class="day-card" id="day-3">
        <div class="day-label"></div>
        <div class="day-date"></div>
        <div class="day-person"></div>
      </div>
      <div class="day-card" id="day-4">
        <div class="day-label"></div>
        <div class="day-date"></div>
        <div class="day-person"></div>
      </div>
      <div class="day-card" id="day-5">
        <div class="day-label"></div>
        <div class="day-date"></div>
        <div class="day-person"></div>
      </div>
    </section>

    <!-- Thông tin & Điều khiển -->
    <section class="info-section">
      <div class="current-week">
        <h3>👥 Danh sách người trực cố định:</h3>
        <p id="namesList"></p>
      </div>
      <div class="buttons-group">
        <button id="prevBtn" class="btn btn-secondary">◀️ Tuần Trước</button>
        <button id="nextBtn" class="btn btn-primary">Tuần Sau ▶️</button>
        <button id="resetBtn" class="btn btn-warning">🔄 Về Tuần Này</button>
        <button id="downloadBtn" class="btn btn-info">⬇️ Tải JSON</button>
      </div>
    </section>

    <footer class="footer">
      <p>💡 Lịch trực cố định: Trang → Thảo → Khoa → Phương → Phúc (chu kỳ 5 tuần)</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
