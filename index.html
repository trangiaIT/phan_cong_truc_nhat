<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch Trực — Thứ 2 đến Thứ 7</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>📅 Lịch Trực Hàng Tuần</h1>
      <p class="subtitle">Thứ 2 → Thứ 7 | 5 Người</p>
    </header>

    <!-- Lịch hiển thị chính -->
    <section class="schedule-grid">
      <div class="day-card" id="day-0">
        <div class="day-label">Thứ Hai</div>
        <div class="day-person"></div>
      </div>
      <div class="day-card" id="day-1">
        <div class="day-label">Thứ Ba</div>
        <div class="day-person"></div>
      </div>
      <div class="day-card" id="day-2">
        <div class="day-label">Thứ Tư</div>
        <div class="day-person"></div>
      </div>
      <div class="day-card" id="day-3">
        <div class="day-label">Thứ Năm</div>
        <div class="day-person"></div>
      </div>
      <div class="day-card" id="day-4">
        <div class="day-label">Thứ Sáu</div>
        <div class="day-person"></div>
      </div>
      <div class="day-card" id="day-5">
        <div class="day-label">Thứ Bảy</div>
        <div class="day-person"></div>
      </div>
    </section>

    <!-- Điều khiển & Tùy chỉnh -->
    <section class="controls">
      <div class="control-panel">
        <h2>⚙️ Quản Lý</h2>
        
        <div class="names-section">
          <label for="names-input">Danh sách người (cách nhau bằng dấu phẩy):</label>
          <input 
            type="text" 
            id="names-input" 
            placeholder="Trang, Thảo, Khoa, Phương, Phúc"
          />
        </div>

        <div class="buttons-group">
          <button id="generateBtn" class="btn btn-primary">🔄 Sinh Lịch</button>
          <button id="rotateBtn" class="btn btn-secondary">↻ Dịch Vòng</button>
          <button id="downloadBtn" class="btn btn-info">⬇️ Tải JSON</button>
          <button id="resetBtn" class="btn btn-warning">🔃 Khôi Phục</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p>💡 Có 6 ngày (Thứ 2 → Thứ 7) và 5 người → một người sẽ trực 2 lần trong tuần</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
