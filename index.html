<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lịch trực — Thứ 2 đến Thứ 7</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Lịch trực (Thứ 2 → Thứ 7) — 5 người</h1>

    <section class="controls">
      <div class="names-inputs">
        <label>Nhập 5 tên (hoặc để mặc định):</label>
        <div class="inputs">
          <input type="text" id="name0" placeholder="Người 1" />
          <input type="text" id="name1" placeholder="Người 2" />
          <input type="text" id="name2" placeholder="Người 3" />
          <input type="text" id="name3" placeholder="Người 4" />
          <input type="text" id="name4" placeholder="Người 5" />
        </div>
      </div>

      <div class="buttons">
        <button id="generateBtn">Tạo lịch</button>
        <button id="rotateBtn" title="Dịch vòng 1 vị trí">Dịch (rotate)</button>
        <button id="downloadBtn">Tải JSON</button>
        <button id="resetBtn">Khôi phục mặc định</button>
      </div>
    </section>

    <section class="schedule">
      <table id="scheduleTable">
        <thead>
          <tr>
            <th>Ngày</th>
            <th>Người trực</th>
          </tr>
        </thead>
        <tbody>
          <!-- populated by script -->
        </tbody>
      </table>
    </section>

    <footer>
      <small>Ghi chú: Có 6 ngày (Thứ 2 → Thứ 7). Khi có 5 người, một người sẽ trực 2 lần trong tuần — thuật toán sẽ phân công theo vòng quay.</small>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
